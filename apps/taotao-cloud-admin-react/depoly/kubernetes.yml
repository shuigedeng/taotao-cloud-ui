apiVersion: apps/v1
kind: Deployment
metadata:
  name: taotao-cloud-admin
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taotao-cloud-admin
  template:
    metadata:
      labels:
        app: taotao-cloud-admin
    spec:
      containers:
        - image: taotao-cloud/taotao-cloud-admin:${CICD_EXECUTION_SEQUENCE}
          name: taotao-cloud-admin
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: TAOTAO_CLOUD_HOST_ADDRESS
              value: http://taotaocloud.top
---
apiVersion: v1
kind: Service
metadata:
  name: taotao-cloud-admin-service
spec:
  type: NodePort
  selector:
    app: taotao-cloud-admin
  ports:
    - name: taotao-admin-ui-port
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30001

name: Assemble Datav

on:
  push:
    #paths:
    #  - 'taotao-cloud-datav-vue3/**'
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

defaults:
  run:
    working-directory: taotao-cloud-datav-vue3

jobs:
  assemble:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.head_commit.message, 'taotao-cloud-datav') }}
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      # https://github.com/marketplace/actions/setup-node-js-environment
      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      # https://github.com/marketplace/actions/cache
      - name: Cache Node_modules Folder
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-node_modules
          restore-keys: ${{ runner.os }}-node_modules

      - name: Get pnpm Cache Directory Path
        id: pnpm-cache-dir-path
        run: echo "::set-output name=dir::$(pnpm cache dir)"

      # https://github.com/marketplace/actions/cache
      - name: Cache pnpm
        uses: actions/cache@v4
        env:
          cache-name: pnpm-cache
        with:
          path: ${{ steps.pnpm-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: pnpm Install And Build
        run: |
          pnpm
          pnpm build

      # https://github.com/marketplace/actions/ssh-deploy
      - name: Deploy To Server
        uses: easingthemes/ssh-deploy@6.0.1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "taotao-cloud-datav-vue3/dist/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_DATAV_TARGET }}

      #- name: Deploy
      #  uses: SamKirkland/FTP-Deploy-Action@2.0.0
